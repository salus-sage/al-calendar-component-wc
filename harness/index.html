<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Date & DateTime Picker Dev Harness</title>
  <link rel="stylesheet" href="tokens.css" />
  <script type="module" src="../dist/albert-date-picker.js"></script>
</head>
<body>
  <h1>Date & DateTime Picker Components</h1>

  <div class="form-group">
    <label class="required">Date (Optional)</label>
    <albert-date-picker
      id="date-picker-optional"
      class="form-control"
      placeholder="Select a date"
    ></albert-date-picker>
  </div>

  <div class="form-group">
    <label class="required">Date & Time</label>
    <albert-datetime-picker
      id="datetime-picker"
      class="form-control"
      placeholder="Select a date and time"
    ></albert-datetime-picker>
  </div>

  <div class="form-group">
    <label class="required">Date (Required)</label>
    <albert-date-picker
      id="date-picker-required"
      class="form-control"
      required
    ></albert-date-picker>
  </div>

  <div class="form-group">
    <label>Date (Disabled)</label>
    <albert-date-picker
      id="date-picker-disabled"
      class="form-control"
      value="2026-05-23"
      is-editable="false"
    ></albert-date-picker>
  </div>

  <div class="form-group">
    <label>Date (With Value)</label>
    <albert-date-picker
      id="date-picker-with-value"
      class="form-control"
      value="2026-06-15"
    ></albert-date-picker>
  </div>
</body>
</html>
